# mpv.conf (ModernZ + Anime4K configuration)

# Отключаем встроенный стандартный интерфейс (обязательно для работы ModernZ)
osc=no
border=yes

# Рендерер и аппаратное ускорение
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe

# Окно и воспроизведение
autofit=75%
keep-open=yes
save-position-on-quit=yes

# Субтитры и звук
sub-auto=fuzzy
sub-font="Segoe UI"
sub-font-size=42
sub-border-size=2.5
audio-file-auto=fuzzy
slang=ru,rus,en,eng
alang=ja,jpn,ru,rus,en,eng
